# Azul y Oro reverse proxy. Install only after the azulyoro certificate and
# /etc/nginx/snippets/azulyoro-cloudflare.conf exist.
# This file is scoped to these server_name values and does not modify other
# production sites on the VPS.

server_tokens off;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name azulyoro.com.ar;

    include /etc/nginx/snippets/azulyoro-cloudflare.conf;

    ssl_certificate     /etc/nginx/ssl/azulyoro.com.ar.pem;
    ssl_certificate_key /etc/nginx/ssl/azulyoro.com.ar.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:azulyoro_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    location /_next/static/ {
        alias /var/www/azulyoro/current/front/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /brand/ {
        alias /var/www/azulyoro/current/front/public/brand/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.azulyoro.com.ar;

    include /etc/nginx/snippets/azulyoro-cloudflare.conf;
    ssl_certificate     /etc/nginx/ssl/azulyoro.com.ar.pem;
    ssl_certificate_key /etc/nginx/ssl/azulyoro.com.ar.key;

    return 301 https://azulyoro.com.ar$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.azulyoro.com.ar;

    include /etc/nginx/snippets/azulyoro-cloudflare.conf;

    ssl_certificate     /etc/nginx/ssl/azulyoro.com.ar.pem;
    ssl_certificate_key /etc/nginx/ssl/azulyoro.com.ar.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:azulyoro_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    location = /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        access_log off;
    }

    # One upstream poll is fanned out to many browsers through SSE. Keep this
    # stream unbuffered and alive through the proxy; the application sends a
    # heartbeat every 15 seconds for Cloudflare and idle connection handling.
    location ~ ^/api/matches/[0-9A-Fa-f-]+/stream$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name azulyoro.com.ar www.azulyoro.com.ar api.azulyoro.com.ar;
    return 301 https://$host$request_uri;
}
