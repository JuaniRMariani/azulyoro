# Nginx reverse proxy for azulyoro — front (Next standalone) + API (.NET Kestrel).
# TLS terminates here with a Cloudflare Origin Certificate; Cloudflare SSL mode
# = Full (strict). Restrict origin to Cloudflare IPs at the firewall.

# --- Real client IP from Cloudflare ---
# Load Cloudflare IP ranges (refresh from https://www.cloudflare.com/ips/).
# set_real_ip_from <cf-range>;  (add each range)
real_ip_header CF-Connecting-IP;

# ---------------- Front: azulyoro.com.ar ----------------
server {
    listen 443 ssl;
    http2 on;
    server_name azulyoro.com.ar www.azulyoro.com.ar;

    ssl_certificate     /etc/nginx/ssl/azulyoro.com.ar.pem;
    ssl_certificate_key /etc/nginx/ssl/azulyoro.com.ar.key;

    # Next.js standalone serves everything; Nginx offloads static assets.
    location /_next/static/ {
        alias /var/www/azulyoro/front/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /public/ {
        alias /var/www/azulyoro/front/public/;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------- API: api.azulyoro.com.ar ----------------
server {
    listen 443 ssl;
    http2 on;
    server_name api.azulyoro.com.ar;

    ssl_certificate     /etc/nginx/ssl/azulyoro.com.ar.pem;
    ssl_certificate_key /etc/nginx/ssl/azulyoro.com.ar.key;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ForwardedHeaders in .NET reads this to emit Secure cookies / correct scheme.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------- HTTP → HTTPS ----------------
server {
    listen 80;
    server_name azulyoro.com.ar www.azulyoro.com.ar api.azulyoro.com.ar;
    return 301 https://$host$request_uri;
}
